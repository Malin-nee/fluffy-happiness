name: Pre-market scan

on:
  schedule:
    # Mon-Fri 12:17 UTC = 08:17 ET in summer (EDT) / 07:17 ET in winter (EST),
    # i.e. always before the 09:30 ET open. GitHub cron runs in UTC and may start a few minutes late.
    - cron: "17 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
        run: python -m premarket_scanner -v | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit daily result
        run: |
          git config user.name "premarket-scanner-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Pre-market scan $(TZ=America/New_York date +%F)"
          git push
